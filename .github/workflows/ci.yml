name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-churn-lib:
    name: Test churn-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-extras
        working-directory: churn-lib
      - name: Run tests
        run: uv run pytest
        working-directory: churn-lib

  test-ml-app:
    name: Test ml-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
        working-directory: ml-app
      - name: Run tests
        run: uv run pytest
        working-directory: ml-app

  lint-churn-lib:
    name: Lint & type-check churn-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
        working-directory: churn-lib
      - name: Check formatting
        run: uv run ruff format --check .
        working-directory: churn-lib
      - name: Lint
        run: uv run ruff check .
        working-directory: churn-lib
      - name: Type-check
        run: uv run pyright .
        working-directory: churn-lib

  lint-ml-app:
    name: Lint & type-check ml-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
        working-directory: ml-app
      - name: Check formatting
        run: uv run ruff format --check .
        working-directory: ml-app
      - name: Lint
        run: uv run ruff check .
        working-directory: ml-app
      - name: Type-check
        run: uv run pyright .
        working-directory: ml-app

  test-agent-lib:
    name: Test agent-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-extras
        working-directory: agent-lib
      - name: Run tests
        run: uv run pytest
        working-directory: agent-lib

  lint-agent-lib:
    name: Lint & type-check agent-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
        working-directory: agent-lib
      - name: Check formatting
        run: uv run ruff format --check .
        working-directory: agent-lib
      - name: Lint
        run: uv run ruff check .
        working-directory: agent-lib
      - name: Type-check
        run: uv run pyright .
        working-directory: agent-lib

  lock-agent-lib:
    name: uv.lock up to date (agent-lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check uv.lock
        run: uv lock --check
        working-directory: agent-lib

  lock-churn-lib:
    name: uv.lock up to date (churn-lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check uv.lock
        run: uv lock --check
        working-directory: churn-lib

  lock-ml-app:
    name: uv.lock up to date (ml-app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check uv.lock
        run: uv lock --check
        working-directory: ml-app

  openapi:
    name: OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
        working-directory: ml-app
      - name: Generate OpenAPI spec
        run: |
          uv run python -c "
          import json
          from app.main import app
          with open('openapi.json', 'w') as f:
              json.dump(app.openapi(), f, indent=2)
              f.write('\n')
          "
        working-directory: ml-app
        env:
          LOG_LEVEL: ERROR
      - name: Check spec is up to date
        run: |
          if git ls-files --error-unmatch ml-app/openapi.json 2>/dev/null; then
            if ! git diff --exit-code ml-app/openapi.json; then
              echo ""
              echo "openapi.json is out of date. Regenerate it:"
              echo "  cd ml-app && uv run python -c \"import json; from app.main import app; open('openapi.json','w').write(json.dumps(app.openapi(), indent=2) + '\n')\""
              exit 1
            fi
          else
            echo "openapi.json is not committed — skipping drift check. Consider committing ml-app/openapi.json."
          fi
      - name: Upload OpenAPI spec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: ml-app/openapi.json
